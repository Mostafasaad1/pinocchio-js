<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinocchio WASM — Browser Tests</title>
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --code-bg: #f1f5f9;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --success: #16a34a;
            --success-bg: #dcfce7;
            --danger: #dc2626;
            --danger-bg: #fee2e2;
            --warning: #d97706;
            --warning-bg: #fef3c7;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg);
            color: var(--text-primary);
            line-height: 1.5;
            padding: 2.5rem 1.5rem;
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-title h1 {
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text-primary);
        }

        .header-title p {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        #global-status {
            font-size: 0.8125rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-loading {
            background-color: var(--warning);
            box-shadow: 0 0 0 2px var(--warning-bg);
        }

        .status-ready {
            background-color: var(--success);
            box-shadow: 0 0 0 2px var(--success-bg);
        }

        .status-error {
            background-color: var(--danger);
            box-shadow: 0 0 0 2px var(--danger-bg);
        }

        .btn {
            appearance: none;
            background-color: var(--surface);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.45rem 0.9rem;
            font-size: 0.8125rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn:hover:not(:disabled) {
            background-color: #f1f5f9;
            border-color: #cbd5e1;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        section {
            margin-bottom: 2.5rem;
        }

        .section-header {
            margin-bottom: 1rem;
        }

        .section-header h2 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .test-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .test-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem 1.25rem;
        }

        .test-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.6rem;
        }

        .test-title {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .badge {
            font-size: 0.6875rem;
            font-weight: 600;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .badge-pending {
            background-color: #f1f5f9;
            color: var(--text-muted);
        }

        .badge-running {
            background-color: var(--warning-bg);
            color: var(--warning);
        }

        .badge-pass {
            background-color: var(--success-bg);
            color: var(--success);
        }

        .badge-fail {
            background-color: var(--danger-bg);
            color: var(--danger);
        }

        .test-output {
            font-family: var(--font-mono);
            font-size: 0.8125rem;
            background-color: var(--code-bg);
            color: #334155;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.45;
        }

        .test-timing {
            margin-top: 0.5rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-family: var(--font-mono);
        }

        /* URDF Loader Section */
        .urdf-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.25rem;
        }

        .urdf-textarea {
            width: 100%;
            height: 120px;
            font-family: var(--font-mono);
            font-size: 0.8125rem;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            resize: vertical;
            color: var(--text-primary);
            background: var(--bg);
            margin-bottom: 0.75rem;
        }

        .urdf-textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .urdf-controls {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-title">
            <h1>Pinocchio WASM</h1>
            <p>Browser Test Runner & Interactive Diagnostics</p>
        </div>
        <div class="header-actions">
            <div id="global-status">
                <span class="status-indicator status-loading"></span>
                <span>Loading module...</span>
            </div>
            <button id="run-all-btn" class="btn btn-primary" disabled>Run All Tests</button>
        </div>
    </header>

    <main>
        <section>
            <div class="section-header">
                <h2>Automated Tests</h2>
            </div>
            <div id="test-list" class="test-list">
                <!-- Dynamically populated from test-suite.mjs -->
            </div>
        </section>

        <section>
            <div class="section-header">
                <h2>URDF Loader & Evaluator</h2>
            </div>
            <div class="urdf-container">
                <textarea id="urdf-input" class="urdf-textarea" placeholder="Paste URDF XML string here to parse and evaluate dynamics..."></textarea>
                <div class="urdf-controls">
                    <button id="urdf-btn" class="btn">Parse & Run RNEA</button>
                    <span id="urdf-badge"></span>
                </div>
                <pre id="urdf-output" class="test-output">Enter URDF XML and click "Parse & Run RNEA".</pre>
            </div>
        </section>
    </main>

    <!-- Load Emscripten WASM module glue -->
    <script src="../../build/pinocchio.js"></script>
    <!-- Load Test Runner & App logic -->
    <script type="module" src="app.mjs"></script>
</body>
</html>
