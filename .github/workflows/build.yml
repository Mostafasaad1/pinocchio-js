name: Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Checkout Pinocchio
        uses: actions/checkout@v4
        with:
          repository: stack-of-tasks/pinocchio
          ref: v2.7.1
          path: pinocchio

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Node Dependencies
        run: npm install

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: 'emsdk-cache'

      - name: Verify Emscripten
        run: emcc -v

      - name: Build WASM
        run: |
          mkdir -p build && cd build
          emcmake cmake .. \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DPINOCCHIO_SOURCE_DIR=$(pwd)/../pinocchio
          emmake make -j$(nproc)

      - name: Run Tests
        run: npm test

      - name: Run TypeScript Type Check
        run: npm run test:types

      - name: Run Smoke Test
        run: npm run test:smoke

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pinocchio-wasm-build
          path: |
            build/pinocchio.js
            build/pinocchio.wasm
            src/pinocchio.d.ts
            src/urdf-parser.d.ts
            src/collision-checker.d.ts
          retention-days: 7
